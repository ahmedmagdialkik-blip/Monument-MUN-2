<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" id="intro-mun-svg" width="100%" height="100%">
  <defs>
    <!-- Rich Luxury Metallic Gold Gradients -->
    <linearGradient id="gold-wreath-grad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#b88e32" />
      <stop offset="30%" stop-color="#d9b45a" />
      <stop offset="65%" stop-color="#fceda2" />
      <stop offset="85%" stop-color="#d9b45a" />
      <stop offset="100%" stop-color="#fbf0b9" />
    </linearGradient>

    <linearGradient id="gold-globe-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fceda2" />
      <stop offset="40%" stop-color="#d9b45a" />
      <stop offset="70%" stop-color="#f5df8b" />
      <stop offset="100%" stop-color="#b88e32" />
    </linearGradient>

    <radialGradient id="globe-center-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff8db" stop-opacity="0.8" />
      <stop offset="35%" stop-color="#d9b45a" stop-opacity="0.4" />
      <stop offset="75%" stop-color="#d9b45a" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#080a1e" stop-opacity="0" />
    </radialGradient>

    <!-- Path for curved Model United Nations text -->
    <path id="text-arc-mun" d="M 285,680 A 310,310 0 0,0 715,680" fill="none" />

    <!-- Filter for soft gold halo -->
    <filter id="emblem-gold-halo" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- BACKGROUND HALO -->
  <circle cx="500" cy="500" r="360" fill="url(#globe-center-glow)" opacity="0.65" id="emblem-center-glow" />

  <!-- 1. GLOBE EMBLEM GROUP (Center azimuthal projection) -->
  <g id="emblem-globe-group">
    <!-- Grid Circles (Parallels of Latitude) -->
    <g stroke="url(#gold-globe-grad)" stroke-width="3" fill="none" opacity="0.92">
      <circle cx="500" cy="500" r="80" />
      <circle cx="500" cy="500" r="160" />
      <circle cx="500" cy="500" r="240" />
      <circle cx="500" cy="500" r="320" />
      <circle cx="500" cy="500" r="350" stroke-width="4.5" />
    </g>

    <!-- Meridian Lines (Radiating Crosshairs & Diagonals) -->
    <g stroke="url(#gold-globe-grad)" stroke-width="2.5" opacity="0.88">
      <line x1="500" y1="150" x2="500" y2="850" />
      <line x1="150" y1="500" x2="850" y2="500" />
      <line x1="252" y1="252" x2="748" y2="748" />
      <line x1="748" y1="252" x2="252" y2="748" />
    </g>

