C 630,740 635,700 650,680 Z" />
    </g>

    <!-- Curved Model United Nations Text -->
    <text font-family="'Cinzel', Georgia, serif" font-size="28" font-weight="700" letter-spacing="0.14em" fill="url(#gold-wreath-grad)" opacity="0.95">
      <textPath href="#text-arc-mun" startOffset="50%" text-anchor="middle">
        Model United Nations
      </textPath>
    </text>
  </g>

