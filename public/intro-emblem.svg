    <!-- Center Base Ribbon / Bow -->
    <g id="wreath-base-ribbon">
      <path d="M 460,935 Q 500,915 540,935 Q 500,955 460,935 Z" fill="#eed27e" />
      <path d="M 470,940 Q 420,960 380,970 Q 420,980 480,950 Z" />
